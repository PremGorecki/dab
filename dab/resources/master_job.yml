# A sample job for init_project.

resources:
  jobs:
    master_job:
      name: dab_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: t1
          notebook_task:
            notebook_path: ${var.dab_notebook1}
            base_parameters:
              t1_param: "my param"

        - task_key: t2
          depends_on:
            - task_key: t1
          notebook_task:
            notebook_path: ${var.dab_notebook2}
            base_parameters:
              from_t1: "{{tasks.t1.values.from_t1}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
