# This is a Declarative Automation Bundle definition for init_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: init_project
  uuid: 859b0a90-8c95-443c-aa72-13c3b6a32838

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617514776713.13.azuredatabricks.net
    variables:
      catalog: unity
      # schema: ${workspace.current_user.short_name}
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405617514776713.13.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/minutnik75@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/minutnik75@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: unity
      schema: prod
    permissions:
      - user_name: minutnik75@gmail.com
        level: CAN_MANAGE
